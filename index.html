<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore appearance before styles and React render. Keep the key in sync with theme/appearance.ts.
      (() => {
        let appearance = 'system';
        try {
          const saved = localStorage.getItem('jornada-cafe:appearance');
          if (saved === 'light' || saved === 'dark') appearance = saved;
        } catch { /* Storage may be unavailable; follow the system for this session. */ }
        const theme = appearance === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : appearance;
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F2EA" />
    <meta name="description" content="Seu espaço para guardar cafés, rituais e descobertas. Uma jornada pessoal, uma xícara de cada vez." />
    <title>Minha Jornada pelo Café</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
